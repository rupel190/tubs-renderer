<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TUBS Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
  /* ── Palette: worn manila punch-card / player-piano roll, not a dark IDE ──
     paper #e8e0cd · ink #26221b · kick clay #b5502f · snare teal #2f7d78
     hat ochre #c79a3e · accent violet #6b4e8c · rule #cbbfa4 */
  :root {
    --paper: #e8e0cd;
    --paper2: #ddd3bb;
    --ink: #26221b;
    --rule: #cbbfa4;
    --kick: #b5502f;
    --snare: #2f7d78;
    --hat: #c79a3e;
    --bass: #6b4e8c;
    --play: #b5502f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(38,34,27,0.04) 39px, rgba(38,34,27,0.04) 40px),
      var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    padding: 32px 20px 60px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { margin-bottom: 26px; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
  .eyebrow {
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 11px; letter-spacing: 0.34em; text-transform: uppercase;
    color: var(--kick); margin-bottom: 6px;
  }
  h1 { font-size: 30px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .sub { font-size: 14px; margin-top: 6px; color: #5c5342; font-style: italic; }

  .controls {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    margin: 22px 0 10px;
  }
  button.play {
    font-family: "SF Mono", ui-monospace, monospace;
    font-size: 14px; font-weight: 600; letter-spacing: 0.05em;
    background: var(--play); color: var(--paper);
    border: none; border-radius: 2px; padding: 11px 22px; cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform 0.05s, box-shadow 0.05s;
  }
  button.play:active { transform: translate(2px,2px); box-shadow: 0 0 0 var(--ink); }
  .tempo { display: flex; align-items: center; gap: 8px; font-family: "SF Mono", ui-monospace, monospace; font-size: 13px; }
  .tempo input { width: 120px; accent-color: var(--kick); }
  .tempo .bpm { min-width: 62px; }

  .grid-card {
    background: var(--paper2);
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    padding: 16px 14px;
    overflow-x: auto;
    box-shadow: 3px 3px 0 var(--rule);
  }
  table.tubs { border-collapse: collapse; font-family: "SF Mono", ui-monospace, monospace; }
  table.tubs td, table.tubs th { text-align: center; }
  .count th {
    font-size: 10px; color: #7a6f57; font-weight: 500;
    padding-bottom: 6px; width: 30px;
  }
  .count th.rowlabel, td.rowlabel {
    text-align: left; padding-right: 14px; width: auto; white-space: nowrap;
  }
  td.rowlabel {
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    font-weight: 600; padding: 3px 14px 3px 2px;
  }
  .cell {
    width: 30px; height: 30px; border: 1px solid var(--rule);
    position: relative; background: rgba(255,255,255,0.16);
  }
  /* beat boundary every 4 steps */
  .cell.beat { border-left: 2px solid #a99c7d; }
  .dot { display: inline-block; width: 15px; height: 15px; border-radius: 50%; }
  .accent .dot { width: 19px; height: 19px; box-shadow: 0 0 0 2px var(--ink); }
  .ghost .dot { width: 8px; height: 8px; opacity: 0.55; }
  .open .dot { background: transparent !important; border: 2px solid currentColor; }
  /* active-step flash during playback */
  .cell.lit { background: rgba(181,80,47,0.28); }
  .colhi { background: rgba(38,34,27,0.05); }

  .legend {
    margin-top: 20px; font-family: "SF Mono", ui-monospace, monospace;
    font-size: 12px; color: #5c5342; line-height: 1.9;
  }
  .legend b { color: var(--ink); }
  .src {
    margin-top: 24px; background: #1f1c16; color: #d8ceb6;
    border-radius: 3px; padding: 14px 16px; overflow-x: auto;
    font-family: "SF Mono", ui-monospace, monospace; font-size: 12.5px; line-height: 1.7;
  }
  .src .k { color: var(--kick); }
  .note { font-size: 12.5px; color: #5c5342; margin-top: 10px; font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Time Unit Box System · playback</div>
    <h1>TUBS Player</h1>
    <div class="sub">Type a groove in boxes, hit play, then punch it into Maschine.</div>
  </header>

  <div class="controls">
    <button class="play" id="play">▶ Play</button>
    <div class="tempo">
      <span>BPM</span>
      <input type="range" id="bpm" min="60" max="180" value="110" />
      <span class="bpm" id="bpmv">110</span>
    </div>
  </div>

  <div class="grid-card">
    <table class="tubs" id="grid"></table>
  </div>

  <div class="legend" id="legend">
    <b>x</b> hit &nbsp; <b>X</b> accent &nbsp; <b>o</b> open hat &nbsp; <b>g</b> ghost &nbsp; <b>.</b> rest
  </div>

  <div class="src">
<pre id="srcview"></pre>
  </div>
  <div class="note">This is the text you'd keep in an Obsidian <code>tubs</code> code block. The renderer below parses exactly this.</div>
</div>

<script>
// ── The TUBS source. This is the plain-text format you'd type in a note. ──
// First optional line "@ ..." sets meta (bpm, steps-per-beat). Then one row
// per instrument: "Label | tokens".  Tokens: x X o g .  (space-separated or not)
const SOURCE = `@ bpm=110 div=4
Hat   | x x x x  x x x x  x x x x  x x x x
Snare | . . . .  X . . .  . . . .  X . . .
Kick  | x . . .  x . . .  x . . .  x . . .
Bass  | X . . g  . . x .  X . . .  . g x .`;

// instrument → sound config (Tone). Simple synth kit, one voice per row.
const VOICES = {
  hat:   { color: 'var(--hat)',   make: () => new Tone.NoiseSynth({ volume: -18, envelope: { attack: 0.001, decay: 0.03, sustain: 0 } }).toDestination(), trig: (s,t,acc)=>s.triggerAttackRelease(0.03, t, acc?1:0.6) },
  snare: { color: 'var(--snare)', make: () => new Tone.NoiseSynth({ volume: -8, envelope: { attack: 0.001, decay: 0.14, sustain: 0 } }).toDestination(), trig: (s,t,acc)=>s.triggerAttackRelease(0.14, t, acc?1:0.7) },
  kick:  { color: 'var(--kick)',  make: () => new Tone.MembraneSynth({ volume: -4 }).toDestination(), trig: (s,t,acc)=>s.triggerAttackRelease('C1','8n', t, acc?1:0.8) },
  bass:  { color: 'var(--bass)',  make: () => new Tone.MonoSynth({ volume: -10, oscillator:{type:'sawtooth'}, filter:{Q:2}, filterEnvelope:{attack:0.01,decay:0.2,sustain:0.2,baseFrequency:120,octaves:2.5}, envelope:{attack:0.01,decay:0.3,sustain:0.3,release:0.2} }).toDestination(), trig: (s,t,acc)=>s.triggerAttackRelease('F1','16n', t, acc?0.9:0.6) },
};

function parse(src) {
  const lines = src.trim().split('\n');
  const meta = { bpm: 110, div: 4 };
  const rows = [];
  for (const line of lines) {
    if (line.startsWith('@')) {
      line.slice(1).split(/\s+/).forEach(kv => {
        const [k,v] = kv.split('=');
        if (k==='bpm') meta.bpm = +v;
        if (k==='div') meta.div = +v;
      });
      continue;
    }
    if (!line.includes('|')) continue;
    const [label, body] = line.split('|');
    const name = label.trim();
    const key = name.toLowerCase();
    const tokens = body.trim().split(/\s+/).join('').split('');
    rows.push({ name, key, tokens });
  }
  const steps = Math.max(...rows.map(r => r.tokens.length));
  return { meta, rows, steps };
}

const model = parse(SOURCE);
document.getElementById('srcview').textContent = SOURCE;

// ── Render grid ──
const grid = document.getElementById('grid');
function render() {
  const { rows, steps, meta } = model;
  let html = '';
  // count header row: 1 e & a per beat
  const syl = ['1','e','&','a'];
  html += '<tr class="count"><th class="rowlabel"></th>';
  for (let i=0;i<steps;i++){
    const s = syl[i % meta.div] || (i % meta.div + 1);
    html += `<th data-col="${i}">${s}</th>`;
  }
  html += '</tr>';
  for (const r of rows) {
    html += `<tr data-row="${r.key}"><td class="rowlabel" style="color:${VOICES[r.key]?.color||'var(--ink)'}">${r.name}</td>`;
    for (let i=0;i<steps;i++){
      const tok = r.tokens[i] || '.';
      const beat = (i % meta.div === 0) ? 'beat' : '';
      html += `<td class="cell ${beat}" data-col="${i}">${renderTok(tok, r.key)}</td>`;
    }
    html += '</tr>';
  }
  grid.innerHTML = html;
}
function renderTok(tok, key) {
  const color = VOICES[key]?.color || 'var(--ink)';
  if (tok === '.' ) return '';
  let cls = 'dot';
  let wrap = '';
  if (tok === 'X') wrap = 'accent';
  else if (tok === 'g') wrap = 'ghost';
  else if (tok === 'o') wrap = 'open';
  return `<span class="${wrap}"><span class="dot" style="background:${color};color:${color}"></span></span>`;
}
render();

// ── Playback ──
let loop = null, parts = {}, playing = false;
const playBtn = document.getElementById('play');
const bpmSlider = document.getElementById('bpm');
const bpmv = document.getElementById('bpmv');

bpmSlider.value = model.meta.bpm;
bpmv.textContent = model.meta.bpm;
bpmSlider.addEventListener('input', () => {
  bpmv.textContent = bpmSlider.value;
  Tone.Transport.bpm.value = +bpmSlider.value;
});

async function start() {
  await Tone.start();
  Tone.Transport.bpm.value = +bpmSlider.value;
  const { rows, steps, meta } = model;
  const voices = {};
  for (const r of rows) if (VOICES[r.key]) voices[r.key] = VOICES[r.key].make();

  const stepDur = '16n'; // div=4 → 16th notes
  loop = new Tone.Sequence((time, step) => {
    for (const r of rows) {
      const tok = r.tokens[step];
      if (!tok || tok === '.') continue;
      const v = VOICES[r.key];
      if (!v) continue;
      const acc = (tok === 'X');
      v.trig(voices[r.key], time, acc);
    }
    // visual: light the active column
    Tone.Draw.schedule(() => lightColumn(step), time);
  }, [...Array(steps).keys()], stepDur);
  loop.start(0);
  Tone.Transport.start();
  playing = true;
  playBtn.textContent = '■ Stop';
}
function stop() {
  Tone.Transport.stop();
  if (loop) { loop.dispose(); loop = null; }
  playing = false;
  playBtn.textContent = '▶ Play';
  clearLight();
}
playBtn.addEventListener('click', () => playing ? stop() : start());

function lightColumn(step) {
  clearLight();
  grid.querySelectorAll(`.cell[data-col="${step}"]`).forEach(c => c.classList.add('lit'));
  grid.querySelectorAll(`th[data-col="${step}"]`).forEach(c => c.classList.add('colhi'));
}
function clearLight() {
  grid.querySelectorAll('.lit').forEach(c => c.classList.remove('lit'));
  grid.querySelectorAll('.colhi').forEach(c => c.classList.remove('colhi'));
}
</script>
</body>
</html>
